# Test deployment built from the current checkout, including local frontend and
# backend changes. It does not use the published application image.
#
# Prepare:
#   cp .env.test.example .env.test
#
# Start or rebuild after pulling code:
#   docker compose --env-file .env.test -f docker-compose.test.yml up -d --build
#
# Stop without deleting database data:
#   docker compose --env-file .env.test -f docker-compose.test.yml down

version: '3.4'

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api-local:test
    container_name: new-api-test
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${NEW_API_TEST_PORT:-3000}:3000"
    volumes:
      - ./data-test:/data
      - ./logs-test:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}@postgres:5432/${POSTGRES_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.test}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env.test}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_COOKIE_TRUSTED_URL=${SESSION_COOKIE_TRUSTED_URL:-}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-test-node
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-test-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: new-api-test-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.test}"]
    networks:
      - new-api-test-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    networks:
      - new-api-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-new-api}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  test_pg_data:

networks:
  new-api-test-network:
    driver: bridge
